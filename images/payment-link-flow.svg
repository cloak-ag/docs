<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Payment link flow: shield into the pool, share the link off-chain, recipient claims from the pool">
  <!-- base rails -->
  <line x1="110" y1="178" x2="382" y2="178" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="478" y1="178" x2="750" y2="178" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M 110 158 Q 430 44 750 158" fill="none" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- pool hexagon -->
  <polygon points="476,178 453,138 407,138 384,178 407,218 453,218" fill="none" stroke="#6366F1" stroke-opacity="0.8" stroke-width="1.5"/>
  <polygon points="448,178 439,162 421,162 412,178 421,194 439,194" fill="#6366F1" fill-opacity="0.35">
    <animate attributeName="fill-opacity" values="0.35;0.35;0.9;0.35;0.35" keyTimes="0;0.19;0.23;0.29;1" dur="9s" repeatCount="indefinite"/>
  </polygon>

  <!-- endpoint nodes -->
  <circle cx="110" cy="178" r="9" fill="#6366F1"/>
  <circle cx="750" cy="178" r="9" fill="#6366F1"/>
  <circle cx="750" cy="178" r="9" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0">
    <animate attributeName="r" values="9;9;24;9" keyTimes="0;0.78;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0.6;0;0" keyTimes="0;0.78;0.8;0.9;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- node labels -->
  <text x="110" y="212" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">You</text>
  <text x="430" y="246" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Shielded pool</text>
  <text x="750" y="212" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Anyone with the link</text>

  <!-- 1: shield dot -->
  <circle r="5" fill="#6366F1" opacity="0">
    <animateMotion path="M 110 178 L 382 178" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.04;0.22;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.06;0.2;0.24;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="246" y="164" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">1 · Shield — free
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.04;0.07;0.26;0.3;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- 2: the link pill travels off-chain -->
  <g opacity="0">
    <rect x="-30" y="-9" width="60" height="18" rx="9" fill="#6366F1"/>
    <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pay#····</text>
    <animateMotion path="M 110 158 Q 430 44 750 158" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.55;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.53;0.57;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <text x="430" y="30" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">2 · Share the link — off-chain, never sent to a server
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.3;0.33;0.56;0.6;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- 3: claim dot -->
  <circle r="5" fill="#10B981" opacity="0">
    <animateMotion path="M 478 178 L 750 178" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.78;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.76;0.8;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="614" y="164" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">3 · Claim — no gas, no sign-up
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.6;0.63;0.86;0.92;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- bottom caption -->
  <text x="430" y="284" text-anchor="middle" fill="#8B93A7" fill-opacity="0.75" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">On-chain, the two wallets never touch — both paths end at the pool.</text>
</svg>
