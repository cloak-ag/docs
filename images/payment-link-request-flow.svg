<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Requesting a payment: you ask off-chain, the payer funds a link, sends it back off-chain, and you claim from the pool — your address never reaches them">
  <!-- base rails -->
  <line x1="110" y1="178" x2="382" y2="178" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="478" y1="178" x2="750" y2="178" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M 110 158 Q 430 44 750 158" fill="none" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- pool hexagon -->
  <polygon points="476,178 453,138 407,138 384,178 407,218 453,218" fill="none" stroke="#6366F1" stroke-opacity="0.8" stroke-width="1.5"/>
  <polygon points="448,178 439,162 421,162 412,178 421,194 439,194" fill="#6366F1" fill-opacity="0.35">
    <animate attributeName="fill-opacity" values="0.35;0.35;0.9;0.35;0.35" keyTimes="0;0.4;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
  </polygon>

  <!-- endpoint nodes -->
  <circle cx="110" cy="178" r="9" fill="#6366F1"/>
  <circle cx="750" cy="178" r="9" fill="#6366F1"/>
  <circle cx="110" cy="178" r="9" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0">
    <animate attributeName="r" values="9;9;24;9" keyTimes="0;0.88;0.97;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0.6;0;0" keyTimes="0;0.88;0.9;0.97;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- node labels -->
  <text x="110" y="212" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">You</text>
  <text x="430" y="246" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Shielded pool</text>
  <text x="750" y="212" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">The payer</text>

  <!-- 1: the ask travels off-chain, you -> payer -->
  <g opacity="0">
    <rect x="-35" y="-9" width="70" height="18" rx="9" fill="none" stroke="#8B93A7" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#8B93A7" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">50 USDC?</text>
    <animateMotion path="M 110 158 Q 430 44 750 158" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.04;0.2;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.06;0.19;0.22;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <text x="430" y="30" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">1 · Ask — any channel, no address attached
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.04;0.07;0.21;0.24;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 2: payer funds a link (shield into the pool) -->
  <circle r="5" fill="#6366F1" opacity="0">
    <animateMotion path="M 750 178 L 478 178" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.26;0.42;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.28;0.41;0.44;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="614" y="164" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">2 · They fund a link — free to create
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.26;0.29;0.43;0.46;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 3: the link comes back off-chain, payer -> you -->
  <g opacity="0">
    <rect x="-30" y="-9" width="60" height="18" rx="9" fill="#6366F1"/>
    <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pay#····</text>
    <animateMotion path="M 750 158 Q 430 44 110 158" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.7;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.69;0.72;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <text x="430" y="30" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">3 · They send you the link — off-chain
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.5;0.53;0.7;0.73;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 4: you claim from the pool -->
  <circle r="5" fill="#10B981" opacity="0">
    <animateMotion path="M 382 178 L 110 178" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.76;0.9;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.78;0.89;0.92;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="246" y="164" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">4 · Claim — they never learn your address
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.76;0.79;0.94;0.97;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- bottom caption -->
  <text x="430" y="284" text-anchor="middle" fill="#8B93A7" fill-opacity="0.75" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Both on-chain paths end at the pool — your address never reaches the payer.</text>
</svg>
