<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="Shielded transfer flow: you deposit into the shielded pool, then send — the lamports stay in the pool and only note ownership moves from you to the recipient. You then hand the recipient the note's secrets off-chain (out of band); only that off-chain handoff makes the note spendable. The recipient only touches the chain if they later withdraw.">
  <!-- base rails -->
  <line x1="110" y1="178" x2="382" y2="178" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="478" y1="178" x2="750" y2="178" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1"/>
  <!-- off-chain arc: note secrets travel You -> Recipient, out of band (never on-chain) -->
  <path d="M 110 150 Q 430 44 750 150" fill="none" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- pool hexagon: the inner "value" fill stays LIT the entire loop — lamports never leave -->
  <polygon points="476,178 453,138 407,138 384,178 407,218 453,218" fill="none" stroke="#6366F1" stroke-opacity="0.8" stroke-width="1.5"/>
  <polygon points="448,178 439,162 421,162 412,178 421,194 439,194" fill="#6366F1" fill-opacity="0.4">
    <animate attributeName="fill-opacity" values="0.4;0.4;0.85;0.5;0.5;0.85;0.5;0.4" keyTimes="0;0.24;0.28;0.34;0.5;0.54;0.6;1" dur="12s" repeatCount="indefinite"/>
  </polygon>

  <!-- endpoint nodes -->
  <circle cx="110" cy="178" r="9" fill="#6366F1"/>
  <circle cx="750" cy="178" r="9" fill="#6366F1"/>
  <!-- recipient "can spend it now" green pulse — fires only AFTER the off-chain handoff arrives -->
  <circle cx="750" cy="178" r="9" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0">
    <animate attributeName="r" values="9;9;24;9" keyTimes="0;0.72;0.8;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0.6;0;0" keyTimes="0;0.72;0.74;0.8;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- node labels -->
  <text x="110" y="212" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">You (sender)</text>
  <text x="430" y="246" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Shielded pool</text>
  <text x="750" y="212" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Recipient</text>

  <!-- persistent hint under the pool: value stays put -->
  <text x="430" y="264" text-anchor="middle" fill="#6366F1" fill-opacity="0.7" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lamports never move</text>

  <!-- 1 · Deposit: a note-dot travels You -> Pool -->
  <circle r="5" fill="#6366F1" opacity="0">
    <animateMotion path="M 110 178 L 382 178" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.04;0.22;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.06;0.2;0.24;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="246" y="164" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">1 · Deposit — free
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.04;0.07;0.22;0.26;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 2 · Send: ownership flips INSIDE the pool. A note chip's owner label swaps you -> recipient + change. -->
  <g>
    <!-- chip: owned by you (fades out) -->
    <text x="430" y="112" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">&#9670; note &#183; owned by you
      <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.24;0.27;0.32;0.36;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- chip: re-committed to recipient + change (fades in) -->
    <text x="430" y="112" text-anchor="middle" fill="#6366F1" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">&#9670; &#8594; recipient   &#9670; &#8594; your change
      <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.37;0.4;0.56;0.6;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="430" y="292" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">2 · Send · one tx · public_amount = 0 — only ownership moves
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.3;0.33;0.58;0.62;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 3 · Note secrets travel OFF-CHAIN from You -> Recipient (out of band). Nothing here is on-chain. -->
  <g opacity="0">
    <rect x="-46" y="-9" width="92" height="18" rx="9" fill="none" stroke="#6366F1" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" fill="#6366F1" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amount + blinding</text>
    <animateMotion path="M 110 150 Q 430 44 750 150" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.58;0.72;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.6;0.7;0.74;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <text x="430" y="40" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">3 · You hand over the note secrets — off-chain, out of band
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.6;0.63;0.76;0.8;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 4 · Optional: recipient withdraws later — the only step SOL leaves the pool -->
  <circle r="5" fill="#10B981" opacity="0">
    <animateMotion path="M 478 178 L 750 178" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.82;0.96;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.82;0.84;0.96;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="614" y="164" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">4 · Recipient withdraws (optional) — the only step SOL leaves
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.82;0.85;0.96;0.99;1" dur="12s" repeatCount="indefinite"/>
  </text>
</svg>
