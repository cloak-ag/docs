<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="Private send vs withdraw: both leave the shielded pool as liquid funds. A private send lands in someone else's wallet; an unshield lands in your own. Same mechanic, different destination, and the link back to your deposit stays hidden.">
  <!-- base rails: pool in the center, your wallet left, their wallet right -->
  <line x1="110" y1="178" x2="382" y2="178" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="478" y1="178" x2="750" y2="178" stroke="#8B93A7" stroke-opacity="0.35" stroke-width="1"/>

  <!-- pool hexagon -->
  <polygon points="476,178 453,138 407,138 384,178 407,218 453,218" fill="none" stroke="#6366F1" stroke-opacity="0.8" stroke-width="1.5"/>
  <polygon points="448,178 439,162 421,162 412,178 421,194 439,194" fill="#6366F1" fill-opacity="0.4">
    <animate attributeName="fill-opacity" values="0.4;0.4;0.85;0.5;0.5;0.85;0.4" keyTimes="0;0.16;0.2;0.3;0.55;0.6;1" dur="11s" repeatCount="indefinite"/>
  </polygon>

  <!-- endpoint nodes -->
  <circle cx="110" cy="178" r="9" fill="#6366F1"/>
  <circle cx="750" cy="178" r="9" fill="#6366F1"/>
  <!-- their wallet receives (green pulse, private send) -->
  <circle cx="750" cy="178" r="9" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0">
    <animate attributeName="r" values="9;9;24;9" keyTimes="0;0.42;0.5;0.58" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0.6;0;0" keyTimes="0;0.42;0.44;0.5;0.58" dur="11s" repeatCount="indefinite"/>
  </circle>
  <!-- your wallet receives (green pulse, unshield) -->
  <circle cx="110" cy="178" r="9" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0">
    <animate attributeName="r" values="9;9;24;9" keyTimes="0;0.82;0.9;0.98" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0.6;0;0" keyTimes="0;0.82;0.84;0.9;0.98" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- node labels -->
  <text x="110" y="212" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Your wallet</text>
  <text x="430" y="246" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Shielded pool</text>
  <text x="750" y="212" text-anchor="middle" fill="#8B93A7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Their wallet</text>

  <!-- persistent punchline -->
  <text x="430" y="292" text-anchor="middle" fill="#6366F1" fill-opacity="0.75" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">both leave the pool as liquid funds — only the destination differs</text>

  <!-- 1 · deposit (shield) You -> Pool -->
  <circle r="5" fill="#6366F1" opacity="0">
    <animateMotion path="M 110 178 L 382 178" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.16;1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.15;0.18;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text x="246" y="164" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">1 · Shield (or already private) — free
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.02;0.05;0.18;0.22;1" dur="11s" repeatCount="indefinite"/>
  </text>

  <!-- 2 · PRIVATE SEND: Pool -> Their wallet (green = liquid SOL out) -->
  <circle r="5" fill="#10B981" opacity="0">
    <animateMotion path="M 478 178 L 750 178" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.28;0.42;1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.3;0.41;0.44;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text x="614" y="164" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">2 · Private send → their address · they get liquid SOL
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.28;0.31;0.5;0.54;1" dur="11s" repeatCount="indefinite"/>
  </text>

  <!-- 3 · UNSHIELD: Pool -> Your wallet (same move, your own address) -->
  <circle r="5" fill="#10B981" opacity="0">
    <animateMotion path="M 382 178 L 110 178" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.68;0.82;1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.7;0.81;0.84;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <text x="246" y="164" text-anchor="middle" fill="#8B93A7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0">3 · Unshield = the same move → your own address
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.68;0.71;0.9;0.94;1" dur="11s" repeatCount="indefinite"/>
  </text>
</svg>
